server.port=8083

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/smarthome?currentSchema=telemetry_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=5000
spring.rabbitmq.listener.simple.retry.max-attempts=10

rabbitmq.exchange=warmhouse.events
rabbitmq.telemetry-queue=telemetry.readings.queue

# Logging
logging.level.com.warmhouse=INFO
